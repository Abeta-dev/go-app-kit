name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag to release (for example v0.3.1)'
        required: true
        type: string

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify immutable tag identity
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          LOCAL_OBJECT=$(git rev-parse "refs/tags/${TAG}")
          LOCAL_COMMIT=$(git rev-parse "${TAG}^{}")
          REMOTE_OBJECT=$(git ls-remote --tags --refs origin "refs/tags/${TAG}" | awk 'NR == 1 {print $1}')
          REMOTE_COMMIT=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk 'NR == 1 {print $1}')
          [ -n "$REMOTE_OBJECT" ] || { echo "Remote tag ${TAG} is missing." >&2; exit 1; }
          REMOTE_COMMIT=${REMOTE_COMMIT:-$REMOTE_OBJECT}
          [ "$LOCAL_OBJECT" = "$REMOTE_OBJECT" ] || { echo "Remote tag object differs from checkout." >&2; exit 1; }
          [ "$LOCAL_COMMIT" = "$REMOTE_COMMIT" ] || { echo "Remote tag commit differs from checkout." >&2; exit 1; }

      - name: Verify source and baseline
        env:
          RELEASE_CANDIDATE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          go mod verify
          go test ./...
          ./scripts/verify_release_baseline.sh

      - name: Verify published module from isolated consumer
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          SCRATCH_DIR=$(mktemp -d)
          trap 'rm -rf "$SCRATCH_DIR"' EXIT
          cd "$SCRATCH_DIR"
          GOWORK=off go mod init example.com/go-app-kit-consumer
          GOPROXY=https://proxy.golang.org GOWORK=off go get "github.com/umesh0492/go-app-kit/india@${TAG}"
          cat > main.go <<'EOF'
          package main

          import (
              "fmt"
              "github.com/umesh0492/go-app-kit/india"
          )

          func main() { fmt.Println(india.ValidatePAN("ABCDE1234F")) }
          EOF
          GOPROXY=https://proxy.golang.org GOWORK=off go build .

      - name: Check release status
        id: release-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; leaving its immutable artifact unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release-status.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file <(awk -v ver="${TAG#v}" 'index($0, "## [" ver "]") == 1 { found=1; print; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
