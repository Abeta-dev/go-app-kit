name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag to verify and release (for example v0.3.1)'
        required: true
        type: string

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE]: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Verify source quality
        run: |
          go mod verify
          go test ./...
          ./scripts/test_bash_compat.sh
          ./scripts/check_version.sh

      - name: Verify immutable release and write manifest
        id: verify_release
        env:
          GIT_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/verify_release.sh "$GIT_TAG"

      - name: Upload release verification manifest
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-manifest-${{ steps.release.outputs.tag || github.run_id }}
          path: release-manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Create release or replace only its manifest asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          test -s release-manifest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing only release-manifest.json."
            gh release upload "$TAG" release-manifest.json --clobber
            exit 0
          fi
          gh release create "$TAG" release-manifest.json --verify-tag --title "$TAG" \
            --notes-file <(awk -v ver="${TAG#v}" 'index($0, "## [" ver "]") == 1 { found=1; print; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
