name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Enforce gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Error: Unformatted files detected by gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test & Race (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go Module Integrity
        run: go mod verify

      - name: Verify Bash 3.2 Script Compatibility
        run: ./scripts/test_bash_compat.sh

      - name: Verify Version & Documentation Synchronization
        run: ./scripts/check_version.sh

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Verify Reference Example Build
        run: go build -v ./examples/invoice_service

      - name: Run Reference Example Test
        run: go test -v ./examples/invoice_service/...

      - name: Verify Statement Coverage Gate
        if: matrix.go-version == '1.26.x'
        run: ./scripts/check_coverage.sh

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outbox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Integration Tests with Race Detector
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/outbox_test?sslmode=disable
          POSTGRES_DB: outbox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: go test -v -tags=integration -race ./...

  security:
    name: Supply Chain & Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Generate CycloneDX SBOM
        run: |
          CYCLONEDX_VERSION="1.12.0"
          curl -fsSL "https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v${CYCLONEDX_VERSION}/cyclonedx-gomod_${CYCLONEDX_VERSION}_linux_amd64.tar.gz" | tar -xz cyclonedx-gomod
          ./cyclonedx-gomod mod -json -output-version 1.5 -output bom.json .
          rm ./cyclonedx-gomod

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cyclonedx-sbom
          path: bom.json

  docs-match-tree:
    name: Docs Match Tree Truth Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Version & Documentation Synchronization
        run: ./scripts/check_version.sh

      - name: Verify Statement Coverage Gate
        run: ./scripts/check_coverage.sh
